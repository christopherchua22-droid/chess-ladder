<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ladder Admin</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Ladder Admin</h1><p class="sub">Only someone with write access to the repo can save changes.</p></div>
    <a class="sub" href="index.html">← Leaderboard</a>
  </header>

  <div class="card" id="login">
    <p class="sub" style="margin-top:0">Sign in with a GitHub fine-grained personal access token (Contents: read &amp; write, this repo only). It is stored only in this browser.</p>
    <div class="row">
      <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
      <button id="signin">Sign in</button>
    </div>
    <div class="msg err" id="loginMsg"></div>
  </div>

  <div id="app" hidden>
    <div class="row" style="justify-content:space-between;margin-top:12px">
      <span class="sub" id="who"></span>
      <button class="ghost" id="signout" style="flex:0 0 auto">Sign out</button>
    </div>

    <h2>Record a game</h2>
    <div class="card">
      <div class="row">
        <select id="pa"></select>
        <select id="res">
          <option value="a">beat</option>
          <option value="draw">drew with</option>
          <option value="b">lost to</option>
        </select>
        <select id="pb"></select>
        <button id="record">Record</button>
      </div>
    </div>

    <h2>Add a player</h2>
    <div class="card">
      <div class="row">
        <input id="newName" placeholder="Player name" maxlength="30">
        <button id="addPlayer">Add</button>
      </div>
    </div>

    <h2>Recent games</h2>
    <div class="card scroll"><table id="games"></table></div>
    <div class="row" style="margin-top:10px">
      <button class="danger" id="undo" style="flex:0 0 auto">Undo last game</button>
    </div>

    <h2>Standings</h2>
    <div class="card scroll"><table id="board"></table></div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="elo.js"></script>
<script>
const C = window.LADDER_CONFIG;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64enc = (s) => btoa(unescape(encodeURIComponent(s)));
const b64dec = (b) => decodeURIComponent(escape(atob(b.replace(/\n/g, ""))));
const API = `https://api.github.com/repos/${C.owner}/${C.repo}`;
let token = null, data = null, sha = null;

function say(text, isErr) { $("msg").textContent = text; $("msg").className = "msg" + (isErr ? " err" : ""); }

async function gh(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: {
    Authorization: "Bearer " + token, Accept: "application/vnd.github+json",
    "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
  return r.json();
}

async function load() {
  const f = await gh(`${API}/contents/${C.path}?ref=${C.branch}&_=${Date.now()}`);
  sha = f.sha;
  data = JSON.parse(b64dec(f.content));
}

async function save(message) {
  const body = { message, branch: C.branch, sha, content: b64enc(JSON.stringify(data, null, 2) + "\n") };
  try {
    const r = await gh(`${API}/contents/${C.path}`, { method: "PUT", body: JSON.stringify(body) });
    sha = r.content.sha;
    return true;
  } catch (e) {
    if (e.status === 409 || e.status === 422) { await load(); refresh(); say("Data changed elsewhere. Reloaded; please retry.", true); }
    else say("Save failed (" + e.message + ").", true);
    return false;
  }
}

function refresh() {
  const { ranked, log } = Elo.compute(data);
  const opts = data.players.map((n) => `<option>${esc(n)}</option>`).join("");
  const a = $("pa").value, b = $("pb").value;
  $("pa").innerHTML = opts; $("pb").innerHTML = opts;
  if (data.players.includes(a)) $("pa").value = a;
  if (data.players.includes(b)) $("pb").value = b;
  else if (data.players.length > 1) $("pb").selectedIndex = 1;

  $("board").innerHTML = ranked.length
    ? '<tr><th>#</th><th>Player</th><th class="num">Elo</th><th class="num">Games</th><th></th></tr>' +
      ranked.map((p) => `<tr><td>${p.rank}</td><td>${esc(p.name)}</td><td class="num">${Math.round(p.rating)}</td>
        <td class="num">${p.games}</td>
        <td class="num">${p.games === 0 ? `<button class="ghost" data-rm="${esc(p.name)}">Remove</button>` : ""}</td></tr>`).join("")
    : '<tr><td class="muted">No players yet.</td></tr>';
  $("board").querySelectorAll("[data-rm]").forEach((btn) => btn.addEventListener("click", () => removePlayer(btn.dataset.rm)));

  const recent = log.slice(-10).reverse();
  $("games").innerHTML = recent.length
    ? recent.map((x) => {
        const res = x.result === "draw" ? "drew with" : x.result === "a" ? "beat" : "lost to";
        return `<tr><td class="muted">${esc(x.date)}</td><td>${esc(x.a)} ${res} ${esc(x.b)}</td>
                <td class="num">${Math.round(x.aBefore)}→${Math.round(x.aAfter)} / ${Math.round(x.bBefore)}→${Math.round(x.bAfter)}</td></tr>`;
      }).join("")
    : '<tr><td class="muted">No games yet.</td></tr>';
  $("undo").disabled = !data.games.length;
}

async function signin(t) {
  token = t;
  $("loginMsg").textContent = "";
  try {
    const repo = await gh(API);
    if (!repo.permissions || !repo.permissions.push) throw new Error("no-write");
    await load();
  } catch (e) {
    token = null; localStorage.removeItem("ladderToken");
    $("loginMsg").textContent = e.message === "no-write"
      ? "That token can't write to this repo."
      : "Sign-in failed. Check the token and the owner/repo in config.js.";
    return;
  }
  localStorage.setItem("ladderToken", t);
  $("login").hidden = true; $("app").hidden = false;
  $("who").textContent = `Editing ${C.owner}/${C.repo}`;
  refresh();
}

async function withSaving(fn) {
  document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try { await fn(); } finally { document.querySelectorAll("button").forEach((b) => (b.disabled = false)); refresh(); }
}

$("signin").onclick = () => { const t = $("token").value.trim(); if (t) signin(t); };
$("signout").onclick = () => { localStorage.removeItem("ladderToken"); location.reload(); };

$("addPlayer").onclick = () => withSaving(async () => {
  const name = $("newName").value.trim();
  if (!name) return say("Enter a name.", true);
  if (data.players.some((p) => p.toLowerCase() === name.toLowerCase())) return say("That player already exists.", true);
  data.players.push(name);
  if (await save("Add player " + name)) { $("newName").value = ""; say(`Added ${name}.`); }
  else data.players.pop();
});

$("record").onclick = () => withSaving(async () => {
  const a = $("pa").value, b = $("pb").value, result = $("res").value;
  if (!a || !b) return say("Add at least two players first.", true);
  if (a === b) return say("Pick two different players.", true);
  const date = new Date().toISOString().slice(0, 10);
  data.games.push({ date, a, b, result });
  if (await save(`Game: ${a} vs ${b} (${result})`)) say("Game recorded. The public page updates in about a minute.");
  else data.games.pop();
});

$("undo").onclick = () => withSaving(async () => {
  if (!data.games.length || !confirm("Remove the most recent game?")) return;
  const last = data.games.pop();
  if (await save("Undo last game")) say("Last game removed.");
  else data.games.push(last);
});

async function removePlayer(name) {
  await withSaving(async () => {
    if (!confirm("Remove " + name + "?")) return;
    const i = data.players.indexOf(name);
    data.players.splice(i, 1);
    if (await save("Remove player " + name)) say("Removed " + name + ".");
    else data.players.splice(i, 0, name);
  });
}

const saved = localStorage.getItem("ladderToken");
if (saved) signin(saved);
</script>
</body>
</html>
